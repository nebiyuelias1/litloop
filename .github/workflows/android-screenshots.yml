name: Play Store Screenshots

on:
  workflow_dispatch:
    inputs:
      video:
        description: 'Also record an app preview video'
        type: boolean
        default: false
      routes:
        description: 'Screens to capture, e.g. "home:|club:book_clubs/1|book:books/2453"'
        type: string
        required: false
      sets:
        description: 'Device sets to capture: phone, tablet-7, tablet-10'
        type: string
        required: false
        default: 'phone,tablet-7,tablet-10'

permissions:
  contents: read

concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "emulator" \
            "cmdline-tools;latest" \
            "system-images;android-36.1;google_apis_playstore;x86_64" > /dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Capture screenshots
        env:
          VIDEO: ${{ inputs.video && '1' || '0' }}
          ROUTES: ${{ inputs.routes }}
          SETS: ${{ inputs.sets }}
          HEADLESS: '1'
          LOAD_TIMEOUT: '90'
        run: bin/android_screenshots.sh

      - name: List screenshots
        run: |
          find build/play-store-screenshots -name '*.png' -print0 |
            while IFS= read -r -d '' file; do
              dims=$(python3 -c 'import struct,sys; f=open(sys.argv[1],"rb"); print("%dx%d" % struct.unpack(">II", f.read(24)[16:24]))' "$file")
              echo "${file} (${dims})"
            done

      - name: Verify Play requirements
        # Each set must be 16:9 or 9:16; 7-inch tablets need every side between
        # 320 and 3840px, 10-inch tablets between 1080 and 7680px; phone
        # screenshots are 9:16 at 320-3840px.
        env:
          SETS: ${{ inputs.sets }}
        run: |
          python3 - <<'PY'
          import glob, os, struct, sys

          limits = {
              "phone": (320, 3840),
              "tablet-7": (320, 3840),
              "tablet-10": (1080, 7680),
          }
          requested = os.environ.get("SETS", ",".join(limits)).split(",")
          failures = []
          for directory in requested:
              lo, hi = limits[directory]
              paths = sorted(glob.glob(f"build/play-store-screenshots/{directory}/*.png"))
              if not paths:
                  failures.append(f"no screenshots in {directory}/")
                  continue
              for path in paths:
                  with open(path, "rb") as f:
                      w, h = struct.unpack(">II", f.read(24)[16:24])
                  label = f"{path} {w}x{h}"
                  side = lambda n: lo <= n <= hi
                  if side(w) and side(h) and w in (9 * h / 16, 16 * h / 9, h * 9 // 16, h * 16 // 9):
                      print(f"ok {label}")
                  else:
                      failures.append(f"bad dimensions: {label} (need 16:9 or 9:16, sides {lo}-{hi})")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          print("all screenshot sets satisfy the Play Store requirements")
          PY

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: play-store-screenshots-${{ github.run_number }}
          path: build/play-store-screenshots
          if-no-files-found: error

      - name: Upload emulator log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots-emulator-log-${{ github.run_number }}
          path: build/android-screenshots/emulator.log
          if-no-files-found: ignore
