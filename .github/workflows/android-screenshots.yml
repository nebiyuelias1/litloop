name: Play Store Screenshots

on:
  workflow_dispatch:
    inputs:
      video:
        description: 'Also record an app preview video'
        type: boolean
        default: false
      routes:
        description: 'Screens to capture, e.g. "home:|club:book_clubs/1|book:books/2453"'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "emulator" \
            "cmdline-tools;latest" \
            "system-images;android-36.1;google_apis_playstore;x86_64" > /dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Capture screenshots
        env:
          VIDEO: ${{ inputs.video && '1' || '0' }}
          ROUTES: ${{ inputs.routes }}
          HEADLESS: '1'
        run: bin/android_screenshots.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: play-store-screenshots-${{ github.run_number }}
          path: build/play-store-screenshots
          if-no-files-found: error

      - name: Upload emulator log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots-emulator-log-${{ github.run_number }}
          path: build/android-screenshots/emulator.log
          if-no-files-found: ignore

      - name: Show dimensions
        run: |
          find build/play-store-screenshots -name '*.png' -print0 |
            while IFS= read -r -d '' file; do
              dims=$(python3 -c 'import struct,sys; f=open(sys.argv[1],"rb"); print("%dx%d" % struct.unpack(">II", f.read(24)[16:24]))' "$file")
              echo "${file} (${dims})"
            done
