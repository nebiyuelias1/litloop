name: System Tests

# Browser (Capybara + headless Chrome) tests, on the two runners where they
# pass reliably: the self-hosted Mac mini and GitHub's Ubuntu 24.04.
# GitHub's macos-latest is left out: there the tests race Turbo page swaps
# (stale-element errors in different tests on each run).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "backend/**"
      - ".github/workflows/system-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/system-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-tests:
    name: System tests (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac mini
            runs-on: [self-hosted, macOS]
            hosted: false
          # Pinned: ubuntu-latest (26.04) has no prebuilt Ruby 3.4.6 yet.
          - name: Ubuntu 24.04
            runs-on: ubuntu-24.04
            hosted: true
    env:
      RAILS_ENV: test
      # Give Turbo navigations time to settle on slower runners.
      CAPYBARA_MAX_WAIT: "10"
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        if: matrix.hosted
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ./backend
          bundler-cache: true

      - name: Install Ruby dependencies
        if: ${{ !matrix.hosted }}
        run: |
          bundle config set jobs 4
          bundle check || bundle install

      - name: Setup database
        run: bin/rails db:test:prepare

      - name: Build CSS
        run: bin/rails tailwindcss:build

      - name: Run system tests
        run: bin/rails test:system

      - name: Upload failure screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-failures-${{ matrix.hosted && 'ubuntu' || 'mac-mini' }}-${{ github.run_number }}
          path: |
            backend/tmp/screenshots
            backend/log/test.log
          if-no-files-found: ignore
