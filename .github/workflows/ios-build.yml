name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  debug-build:
    name: Debug Build
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/LitLoop.xcodeproj -scheme LitLoop

      - name: Build for simulator (no signing)
        run: |
          xcodebuild build \
            -project ios/LitLoop.xcodeproj \
            -scheme LitLoop \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  release:
    name: Release to TestFlight
    if: github.event_name == 'workflow_dispatch'
    # GitHub-hosted (free for public repos) so releases always have a current
    # Xcode; signing uses the App Store Connect API key, nothing from the Mac mini.
    runs-on: macos-26
    environment: staging
    env:
      LITLOOP_BUILD_NUMBER: ${{ github.run_number }}
      APPLE_TEAM_ID: RS57N22N3P
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # App Store Connect rejects uploads built with an SDK older than iOS 26
      # (enforced since April 2026), so fail here instead of after a 10-minute
      # archive. Install Xcode 26+ on the runner to fix.
      - name: Select Xcode 26
        run: |
          xcode_app=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode_app" ]; then
            echo "::error::No Xcode 26 found on this runner image."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode_app"

      - name: Check Xcode version
        run: |
          xcode-select -p
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR==1 {split($2, v, "."); print v[1]}')
          if [ "$major" -lt 26 ]; then
            echo "::error::Xcode $major found; App Store uploads require Xcode 26 or newer (iOS 26 SDK)."
            exit 1
          fi

      # Signing is done with an App Store Connect API key instead of an Apple ID
      # signed into Xcode, so it works on a headless runner. Create the key in
      # App Store Connect > Users and Access > Integrations > App Store Connect
      # API (role: Admin, required for cloud-managed distribution certificates)
      # and add these secrets to the staging environment:
      #   ASC_KEY_ID          the key's Key ID
      #   ASC_ISSUER_ID       the Issuer ID shown above the keys table
      #   ASC_KEY_P8_BASE64   base64 -i AuthKey_XXXX.p8 | pbcopy
      # The app record for et.netale.litloop must exist in App Store Connect
      # before the first upload (the API cannot create it).
      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name in the staging environment."
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          {
            echo "ASC_KEY_PATH=$key_path"
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/LitLoop.xcodeproj -scheme LitLoop

      - name: Archive release
        run: |
          xcodebuild archive \
            -project ios/LitLoop.xcodeproj \
            -scheme LitLoop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LitLoop.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$LITLOOP_BUILD_NUMBER"

      - name: Generate ExportOptions.plist
        run: |
          python3 - "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          import os, plistlib, sys
          with open(sys.argv[1], "wb") as f:
              plistlib.dump({
                  "method": "app-store-connect",
                  "destination": "upload",
                  "signingStyle": "automatic",
                  "teamID": os.environ["APPLE_TEAM_ID"],
                  "uploadSymbols": True,
                  "manageAppVersionAndBuildNumber": False,
              }, f)
          EOF

      # With destination=upload, the export signs for distribution and sends
      # the build straight to App Store Connect, where it appears in TestFlight
      # after processing.
      - name: Upload to App Store Connect
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LitLoop.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload dSYMs
        uses: actions/upload-artifact@v4
        with:
          name: litloop-dsyms-${{ github.run_number }}
          path: ${{ runner.temp }}/LitLoop.xcarchive/dSYMs

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
