name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    env:
      LITLOOP_VERSION_CODE: ${{ github.run_number }}
      # Telegram Login SDK resolves from GitHub Packages (TelegramMessenger org),
      # which the built-in GITHUB_TOKEN can't read — requires a PAT with read:packages.
      GITHUB_USERNAME: nebiyuelias1
      GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || secrets.KAMAL_REGISTRY_PASSWORD }}
      # The OIDC client id is the bot's numeric id (TELEGRAM_BOT_TOKEN prefix).
      # If empty, in-app Telegram login is a no-op.
      TELEGRAM_LOGIN_CLIENT_ID: ${{ vars.TELEGRAM_LOGIN_CLIENT_ID }}
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: litloop-debug-apk-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release-aab:
    name: Release AAB
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    env:
      LITLOOP_VERSION_CODE: ${{ github.run_number }}
      # Telegram Login SDK resolves from GitHub Packages (TelegramMessenger org),
      # which the built-in GITHUB_TOKEN can't read — requires a PAT with read:packages.
      GITHUB_USERNAME: nebiyuelias1
      GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || secrets.KAMAL_REGISTRY_PASSWORD }}
      # The OIDC client id is the bot's numeric id (TELEGRAM_BOT_TOKEN prefix).
      # If empty, in-app Telegram login is a no-op.
      TELEGRAM_LOGIN_CLIENT_ID: ${{ vars.TELEGRAM_LOGIN_CLIENT_ID }}
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/litloop-upload.keystore"

      - name: Build signed release AAB
        env:
          LITLOOP_UPLOAD_KEYSTORE: ${{ runner.temp }}/litloop-upload.keystore
          LITLOOP_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LITLOOP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LITLOOP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: litloop-release-aab-v${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
