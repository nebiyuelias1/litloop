name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    # Pull requests from forks run on a GitHub-hosted runner: the self-hosted
    # Mac mini persists between jobs, so it only runs code from this repository.
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'self-hosted' || 'ubuntu-24.04' }}
    environment: staging
    env:
      RAILS_ENV: test
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            backend
            .github/workflows

      - name: Set up Ruby
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ./backend
          bundler-cache: true

      - name: Install Ruby dependencies
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          bundle config set jobs 4
          bundle check || bundle install

      - name: Run RuboCop
        run: bin/rubocop --parallel

      - name: Run ERB Lint
        run: bin/erb_lint --lint-all

      - name: Setup database
        run: bin/rails db:test:prepare

      - name: Run tests
        run: bin/rails test
